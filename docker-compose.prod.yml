services:
  postgres:
    # pgvector-enabled image — LegalMetadataPgVector migration will create
    # the `embedding_vec` column + HNSW index on rag_chunks for fast ANN
    # search. The plain `postgres:16-alpine` image has no `vector` package,
    # so the migration gracefully skipped and the RAG service fell back to
    # in-memory cosine over JSON `embedding` TEXT.
    # pgvector-enabled image — LegalMetadataPgVector migration will create
    # the `embedding_vec` column + HNSW index on rag_chunks for fast ANN
    # search. The plain `postgres:16-alpine` image has no `vector` package,
    # so the migration gracefully skipped and the RAG service fell back to
    # in-memory cosine over JSON `embedding` TEXT.
    #
    # Note: pgvector/pgvector is published only on Debian-based tags
    # (bookworm / trixie) — there is no `-alpine` variant upstream.
    # Use the unversioned `pg16` tag to track the latest Debian build
    # for PG16, or pin a specific version like `0.8.3-pg16` for
    # reproducibility.
    image: pgvector/pgvector:pg16
    container_name: law-ai-postgres
    restart: unless-stopped
    # We do NOT expose port 5432 to the public internet for security.
    # The backend container connects to it internally via the Docker network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawai_password}
      POSTGRES_DB: ${POSTGRES_DB:-law_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lawai}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - law-ai-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      network: host
    container_name: law-ai-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-lawai}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-lawai_password}
      DATABASE_NAME: ${POSTGRES_DB:-law_ai}
      BACKEND_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me-min-32-chars-long-aaaaaa}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-another-secret-key-change-me-min-32-chars-bbbbbbb}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-key-change-me-min-32-chars-long-aaaaaa}
      RAG_MIN_COSINE_SCORE: ${RAG_MIN_COSINE_SCORE:-0.35}
      RAG_ALLOWED_BUCKETS: ${RAG_ALLOWED_BUCKETS:-}
      OCR_SERVICE_URL: http://ocr-service:8000/ocr
    depends_on:
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_started
    networks:
      - law-ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      network: host
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super-secret-key-change-me-min-32-chars-long-aaaaaa}
        - NEXTAUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: law-ai-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-key-change-me-min-32-chars-long-aaaaaa}
    depends_on:
      - backend
    networks:
      - law-ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ocr-service:
    build:
      context: ./apps/ocr-service
      dockerfile: Dockerfile
    container_name: law-ai-ocr
    restart: unless-stopped
    ports:
      - '8000:8000'
    networks:
      - law-ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  law-ai-network:
    driver: bridge
