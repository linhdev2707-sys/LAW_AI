# nginx config for ilaw.io.vn
# Drop into /etc/nginx/sites-available/ilaw.io.vn, then symlink:
#   sudo ln -s /etc/nginx/sites-available/ilaw.io.vn /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Assumes:
#   - backend running on localhost:4000 (Docker or pm2)
#   - frontend running on localhost:3000 (Docker or pm2)
#   - SSL handled by certbot (Let's Encrypt)
#
# After running `sudo certbot --nginx -d ilaw.io.vn -d www.ilaw.io.vn`,
# certbot will auto-rewrite the HTTP block to redirect 80→443 and add
# the SSL settings inside the `server { listen 443 ssl http2; ... }` block.
# Below is the post-certbot layout.

# ─── HTTP → HTTPS redirect (certbot adds this automatically) ───────────
server {
    listen 80;
    listen [::]:80;
    server_name ilaw.io.vn www.ilaw.io.vn;

    # Lets certbot reach the ACME challenge before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main HTTPS server ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ilaw.io.vn www.ilaw.io.vn;

    # SSL certs (certbot-managed)
    ssl_certificate     /etc/letsencrypt/live/ilaw.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ilaw.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers — match what NestJS sets in production.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP is set by the FE; don't override here or auth pages break.

    # File upload limit — match the BE's 50 MB cap. nginx default is
    # only 1 MB, which silently drops multipart uploads.
    client_max_body_size 60m;

    # Long timeouts for the OCR upload path (PDFs up to 50MB).
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ─── Frontend (Next.js) ─────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (Next.js HMR in dev / future features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Backend API ────────────────────────────────────────────────
    # /api/* is the global prefix from main.ts: app.setGlobalPrefix('api/v1', ...)
    # so the FE talks to /api/v1/auth/... and we forward to BE's /
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Don't buffer the request body — the BE controller uses
        # @Body() and rawBody for HMAC verification (OcrCallbackGuard).
        # Buffering breaks the rawBody capture.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ─── Swagger UI (optional, admin-only) ──────────────────────────
    location /api/docs {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check (no auth) ─────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }

    # ─── Static assets caching ──────────────────────────────────────
    # Next.js emits hashed files under /_next/static/ — cache them
    # aggressively.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
