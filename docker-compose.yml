services:
  postgres:
    image: postgres:16-alpine
    container_name: law-ai-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawai_password}
      POSTGRES_DB: ${POSTGRES_DB:-law_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lawai}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (NestJS) and Frontend (Next.js) are intentionally NOT defined
  # here. Run them on the host via `pnpm dev` from the repo root so that
  # HMR / file watching work natively and you can iterate on:
  #   - Backend:  http://localhost:4000  (Swagger at /api/docs)
  #   - Frontend: http://localhost:3000
  # The host BE/FE talk to Postgres via localhost:5433 (see apps/backend/.env).
  #
  # When you're ready to deploy the full stack in containers, restore the
  # `backend` and `frontend` services (with their Dockerfiles) and rebuild
  # the images — see git history of this file for the full version.

volumes:
  postgres_data:
